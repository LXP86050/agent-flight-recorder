[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-flight-recorder"
version = "0.1.0"
description = "Append-only flight recorder for LLM agent runs: content-addressed traces, deterministic replay, and step-level diff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lokesh Pulivarthi" }]
keywords = ["llm", "agents", "replay", "tracing"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.urls]
Repository = "https://github.com/LXP86050/agent-flight-recorder"

[project.scripts]
afr = "agent_flight_recorder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_flight_recorder"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agent_flight_recorder",
    "tests",
    "examples",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["agent_flight_recorder"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
addopts = "-q --cov=agent_flight_recorder --cov-report=term-missing"
